	<script>
		(() => {
			const smartBack = document.querySelector('[data-smart-back]');
			if (smartBack) {
				const cameFromThisSite = document.referrer && document.referrer.indexOf(location.origin + '/') === 0 && document.referrer !== location.href;
				if (cameFromThisSite && history.length > 1) {
					smartBack.addEventListener('click', (e) => {
						e.preventDefault();
						history.back();
					});
				}
			}

			const lensButtons = [...document.querySelectorAll('[data-lens]')];
			const rows = [...document.querySelectorAll('[data-kind]')];
			lensButtons.forEach(button => button.addEventListener('click', () => {
				const lens = button.dataset.lens;
				lensButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
				rows.forEach(row => row.hidden = row.dataset.kind !== lens);
			}));

			const menuTrigger = document.querySelector('[data-menu-trigger]');
			const mobileMenu = document.querySelector('[data-mobile-menu]');
			if (menuTrigger && mobileMenu) {
				menuTrigger.addEventListener('click', () => {
					const open = mobileMenu.hasAttribute('data-open');
					if (open) {
						mobileMenu.removeAttribute('data-open');
						menuTrigger.setAttribute('aria-expanded', 'false');
					} else {
						mobileMenu.setAttribute('data-open', '');
						menuTrigger.setAttribute('aria-expanded', 'true');
					}
				});
			}

			const zoomLinks = [...document.querySelectorAll('a.kf-plate--zoom')];
			const lightbox = document.querySelector('[data-lightbox]');
			if (zoomLinks.length && lightbox) {
				const lightboxImg = lightbox.querySelector('[data-lightbox-img]');
				const lightboxClose = lightbox.querySelector('[data-lightbox-close]');
				let lastFocused = null;

				const openLightbox = (href, alt) => {
					lastFocused = document.activeElement;
					lightboxImg.src = href;
					lightboxImg.alt = alt || '';
					lightbox.setAttribute('data-open', '');
					lightboxClose.focus();
					document.body.style.overflow = 'hidden';
				};
				const closeLightbox = () => {
					lightbox.removeAttribute('data-open');
					lightboxImg.src = '';
					document.body.style.overflow = '';
					if (lastFocused) lastFocused.focus();
				};

				zoomLinks.forEach(link => {
					link.addEventListener('click', (e) => {
						e.preventDefault();
						const img = link.querySelector('img');
						openLightbox(link.getAttribute('href'), link.dataset.alt || (img ? img.alt : ''));
					});
				});

				lightbox.addEventListener('click', (e) => {
					if (e.target === lightbox) closeLightbox();
				});
				lightboxClose.addEventListener('click', closeLightbox);
				document.addEventListener('keydown', (e) => {
					if (e.key === 'Escape' && lightbox.hasAttribute('data-open')) closeLightbox();
				});
			}
		})();
	</script>
